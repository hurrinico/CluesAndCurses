<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clues&amp;Curses">
<meta name="description" content="Clues & Curses: casi misteriosi a Oakhaven, risolti a colpi di enigmi.">
<title>Clues & Curses</title>
$GODOT_HEAD_INCLUDE
<!--CC_AUTH-->
<style>
/* Clues & Curses - pagina del browser game (GDD #07: browser game adattivo).
   Il gioco è verticale. Sul telefono riempie lo schermo (rispettando notch e barra Home),
   sul tablet arriva fino a 3:4, sul PC resta una colonna 9:16 al centro. */
:root { --night: #0b0a12; --night1: #14121f; --night3: #262640; --gold: #f0c060; --text: #fff4cc;
  --dim: #56607e; --arcane: #6b2f7a; --blood: #cc3a2e; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--night);
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
body { display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, var(--night1) 0%, var(--night) 70%); }
#frame { position: relative; box-sizing: border-box; height: 100%; width: min(100vw, calc(100vh * 9 / 16));
  width: min(100vw, calc(100dvh * 9 / 16));
  background: var(--night);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
/* Dispositivi touch (telefoni, tablet): tutta la larghezza fino a 3:4 */
@media (pointer: coarse) { #frame { width: min(100vw, calc(100vh * 3 / 4)); width: min(100vw, calc(100dvh * 3 / 4)); } }
/* Su PC la colonna ha una cornice sottile */
@media (pointer: fine) and (min-aspect-ratio: 3/4) { #frame { box-shadow: 0 0 0 1px var(--night3), 0 0 60px #000; } }
#canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; background: var(--night); color: var(--text); font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
  text-align: center; padding: 24px; box-sizing: border-box; }
#status img { width: min(70%, 360px); image-rendering: pixelated; }
#bar { width: 55%; height: 6px; background: var(--night1); border: 1px solid var(--dim); }
#bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
#notice { display: none; max-width: 85%; color: var(--blood); }
#rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--night); color: var(--text);
  font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
#rotate b { color: var(--gold); font-size: 34px; }
/* Telefono in orizzontale: il gioco è pensato in verticale */
@media (pointer: coarse) and (orientation: landscape) and (max-height: 540px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="frame">
  <canvas id="canvas" tabindex="0">Il tuo browser non supporta il canvas.</canvas>
  <div id="status">
    <img src="logo.png" alt="Clues & Curses">
    <div id="bar"><i></i></div>
    <div id="label">Caricamento…</div>
    <div id="notice"></div>
  </div>
</div>
<div id="rotate"><b>&#x21bb;</b>Ruota il telefono in verticale<br>per continuare l'indagine.</div>
<noscript>Serve JavaScript per giocare.</noscript>

<script>
// Versione "impacchettata" (artifact di Claude): i file hanno estensione .wasm perché sono
// gli unici binari accettati. Il motore è compresso (engine.gz.wasm) e lo decomprimiamo qui;
// il pacchetto dati index.pck è pubblicato come game.pck.wasm.
// Versione per l'hosting (Cloudflare): CC_ENGINE_GZ = true. Solo il motore è compresso,
// perché index.wasm (35 MB) supera il limite di 25 MiB per file; index.pck resta com'è.
(function () {
  const packed = !!window.CC_PACKED;
  if (!packed && !window.CC_ENGINE_GZ) return;
  const origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : input.url;
    if (packed && /index\.pck(\?.*)?$/.test(url)) {
      return origFetch(url.replace(/index\.pck/, 'game.pck.wasm'), init);
    }
    if (/index\.wasm(\?.*)?$/.test(url) && 'DecompressionStream' in window) {
      return origFetch(url.replace(/index\.wasm/, 'engine.gz.wasm'), init).then((r) => {
        if (!r.ok) return r;
        const body = r.body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    return origFetch(input, init);
  };
})();
</script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const canvas = document.getElementById('canvas');
const frame = document.getElementById('frame');

// Niente menu contestuale (tasto destro = "X" nel Picross) e niente gesti del browser sul gioco.
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// Il canvas segue la cornice; la risoluzione interna tiene conto degli schermi ad alta densità.
function fitCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.round(r.width * dpr));
  const h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}
fitCanvas();
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
new ResizeObserver(fitCanvas).observe(frame);

GODOT_CONFIG.canvasResizePolicy = 0;   // la dimensione la decide fitCanvas()
if (window.CC_PACKED) GODOT_CONFIG.serviceWorker = '';   // niente PWA dentro l'artifact
const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const bar = document.querySelector('#bar > i');
const label = document.getElementById('label');
const notice = document.getElementById('notice');

function fail(err) {
  console.error(err);
  notice.textContent = (err && err.message) ? err.message : String(err);
  notice.style.display = 'block';
  label.textContent = 'Impossibile avviare il gioco';
}

const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  fail('Il browser non supporta: ' + missing.join(', ') + '. Prova con Chrome, Edge, Firefox o Safari aggiornati.');
} else if ((window.CC_PACKED || window.CC_ENGINE_GZ) && !('DecompressionStream' in window)) {
  fail('Browser troppo vecchio (manca DecompressionStream). Aggiorna il browser.');
} else {
  engine.startGame({
    onProgress: (cur, total) => {
      if (total > 0) {
        const p = Math.min(100, Math.round(cur / total * 100));
        bar.style.width = p + '%';
        label.textContent = 'Caricamento… ' + p + '%';
      }
    },
  }).then(() => { statusEl.remove(); canvas.focus(); }, fail);
}
</script>
</body>
</html>
